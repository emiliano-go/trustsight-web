name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The rules-map gate derives src/rules.js from the trustsight catalog,
      # so it needs that checkout beside this one. Without it `npm run build`
      # cannot import trustsight and the whole build fails.
      - uses: actions/checkout@v4
        with:
          repository: emiliano-go/trustsight
          ref: master
          path: trustsight
      - name: Point the rules-map gate at the trustsight catalog
        run: echo "TRUSTSIGHT_SRC=$GITHUB_WORKSPACE/trustsight/src" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "seoslug>=2.0.1"
      - run: python scripts/generate_seo.py --check
      - run: npm ci
      - run: npm run verify:content
      - run: npm run verify:csp
      # The rules-map gate needs the trustSight catalog checked out above, so it
      # runs here rather than inside `npm run build`: Cloudflare Pages builds
      # `npm run build` without the sibling checkout, and a deployable build
      # must not depend on one.  This is the only place the gate is enforced.
      - run: npm run verify:rules
      - run: npm run build
      - run: npm run verify:budget
