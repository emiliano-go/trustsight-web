name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "seoslug>=2.0.1"
      - run: python scripts/generate_seo.py --check
      - run: npm ci
      - run: npm run verify:content
      - run: npm run verify:csp
      - run: npm run build
      - run: npm run verify:budget
