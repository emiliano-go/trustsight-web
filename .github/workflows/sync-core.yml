name: sync-core

# Keeps the site in step with the TrustSight catalog. The published figures
# and rule map are derived from core, but core moves on its own schedule;
# without this job the site silently lags until someone notices.
#
# Scheduled rather than dispatch-on-core-push so it needs no cross-repo
# token. Every run regenerates, gates the result, and opens (or refreshes) a
# pull request. If a gate fails it opens an issue instead, so a blocked sync
# cannot hide.
#
# GITHUB_TOKEN cannot push changes under .github/workflows, which is why the
# pinned core commit lives in .github/trustsight-commit rather than in ci.yml.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-core
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TRUSTSIGHT_SRC: ${{ github.workspace }}/trustsight/src
      CORE_REPOSITORY: emiliano-go/trustsight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve the current pin
        id: pin
        run: echo "sha=$(cat .github/trustsight-commit)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: emiliano-go/trustsight
          ref: master
          path: trustsight
          persist-credentials: false

      - name: Resolve the core tip
        id: core
        run: echo "sha=$(git -C trustsight rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: pip install "seoslug==2.3.0"

      - name: Regenerate the catalog-derived site data
        run: |
          python scripts/generate_rules_map.py
          python scripts/generate_seo.py
          printf '%s\n' "${{ steps.core.outputs.sha }}" > .github/trustsight-commit

      # Run the same gates as CI before proposing the change. A PR opened by
      # GITHUB_TOKEN does not trigger pull_request workflows, so the checks
      # have to happen here.
      - run: npm ci
      - run: npm run verify:content
      - run: npm run verify:csp
      - run: npm run verify:rules
      - run: npm run build
      - run: npm run verify:budget

      - name: Detect a change
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the sync pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_SHA: ${{ steps.core.outputs.sha }}
          PIN_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -eu
          branch=chore/sync-core
          short=${CORE_SHA:0:12}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(site): sync the catalog to $short"
          git push --force-with-lease origin "$branch"

          commits=$(git -C trustsight log --oneline "$PIN_SHA..$CORE_SHA" 2>/dev/null | head -20 || true)
          if [ -z "$commits" ]; then
            commits=$(git -C trustsight log --oneline -10)
          fi
          body=$(printf 'Regenerated from `%s`.\n\n%s\n\nGenerated by `.github/workflows/sync-core.yml`; the checks in that job already passed.\n' "$CORE_SHA" "$commits")

          if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -q '^[1-9]'; then
            gh pr edit "$branch" --title "sync: core $short" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "sync: core $short" --body "$body"
          fi

      - name: Report a blocked sync
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh label create sync-blocked --color d93f0b \
            --description "The site could not be synced to core" --force
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf 'The scheduled site sync failed. It will retry on the next schedule.\n\nRun: %s\nCore tip: %s\n' "$run" "${{ steps.core.outputs.sha }}")
          number=$(gh issue list --label sync-blocked --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "sync: site is behind core" --label sync-blocked --body "$body"
          fi

      - name: Nothing to sync
        if: steps.diff.outputs.changed != 'true'
        run: echo "site already matches core ${{ steps.core.outputs.sha }}"
